services:
  # 1. Streamlit Interactive Data Dashboard
  - type: web
    name: varuna-streamlit-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Flask REST API & Landing Page
  - type: web
    name: varuna-flask-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
